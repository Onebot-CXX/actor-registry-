name: Validate Package Submission

on:
  pull_request:
    paths:
      - "entries/**"
      - "index/**"
      - "generate_package_index.py"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require an explicit canonical tooling commit
        env:
          TOOLING_COMMIT: ${{ vars.OBCX_TOOLING_COMMIT }}
        run: python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["TOOLING_COMMIT"]), "Set OBCX_TOOLING_COMMIT to an approved full core commit; no branch fallback"'
      - uses: actions/checkout@v4
        with:
          repository: Onebot-CXX/OBCX
          ref: ${{ vars.OBCX_TOOLING_COMMIT }}
          path: tooling
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check package entries and deterministic index
        env:
          OBCX_PACKAGE_TOOL: ${{ github.workspace }}/tooling/cmake/package_tool.py
        run: python3 -m unittest discover -s tests -v
